[project]
name = "dlp-estimate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.4"
dependencies = [
    "galois==0.4.11",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pytest==9.1.1",
    "qualtran==0.7.0",
    "sympy==1.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
]
