[project]
name = "dlp-estimate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.4"
dependencies = [
    "graphviz==0.20.3",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "qret-cli-bundle",
    "qualtran==0.7.0",
    "quri-parts-qret==0.27.0",
    "quri-parts-qsub==0.27.0",
    "streamlit==1.64.0",
    "sympy==1.14.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
all = "ignore"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
qret-cli-bundle = { git = "https://github.com/QunaSys/quration-cli-bundle.git" }

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.8",
]
