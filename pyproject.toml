[project]
name = "dlp-estimate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.4"
dependencies = [
    "cirq-core==1.7.0",
    "graphviz==0.20.3",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "qualtran",
    "sympy==1.14.0",
    "tqdm>=4.60",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.literature_data" = [
    "*.json",
    "*.md",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
all = "ignore"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
qualtran = { git = "https://github.com/quantumlib/Qualtran.git", branch = "main" }

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.8",
]
